<!DOCTYPE html>
<html>
  <head>
    <title>Vehicle Tracker</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 20px;
      }
      #map {
        height: 400px;
        width: 100%;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h2>🚗 Vehicle Tracker</h2>
    <label for="vehicleID">Vehicle ID:</label>
    <input type="text" id="vehicleID" placeholder="e.g. car123" />
    <button onclick="startTracking()">Start Tracking</button>
    <p id="status"></p>
    <div id="map"></div>

    <script>
      let map, marker, watchId;

      function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 13.736717, lng: 100.523186 }, // Bangkok default
          zoom: 14,
        });
      }

      function startTracking() {
        const vehicleID = document.getElementById("vehicleID").value.trim();
        const status = document.getElementById("status");

        if (!vehicleID) {
          status.textContent = "❗ Please enter a vehicle ID.";
          return;
        }

        if (!navigator.geolocation) {
          status.textContent = "❌ Geolocation not supported.";
          return;
        }

        status.textContent = `📡 Tracking started for "${vehicleID}"...`;

        // Load first location of the day
        fetch(`https://script.google.com/macros/s/AKfycbyA79qRoYTLZi_2BmpgEf0oaHPssh9xvmoZLXk6tObRf-iCdE_9a1HWpsPtQXw104ZA/exec?vehicle=${vehicleID}&first=1`)
          .then((res) => res.json())
          .then((data) => {
            if (data && data.lat && data.lng) {
              const startPos = { lat: parseFloat(data.lat), lng: parseFloat(data.lng) };
              new google.maps.Marker({
                position: startPos,
                map: map,
                label: "Start",
              });
              map.setCenter(startPos);
            }
          });

        // Start watching live position
        watchId = navigator.geolocation.watchPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const pos = { lat, lng };

            // Update marker
            if (!marker) {
              marker = new google.maps.Marker({
                position: pos,
                map: map,
                title: "You",
              });
            } else {
              marker.setPosition(pos);
            }

            map.setCenter(pos);

            // Send to server
            const url = `https://script.google.com/macros/s/AKfycbyA79qRoYTLZi_2BmpgEf0oaHPssh9xvmoZLXk6tObRf-iCdE_9a1HWpsPtQXw104ZA/exec?vehicle=${vehicleID}&lat=${lat}&lng=${lng}`;
            fetch(url).then(() => {
              console.log(`📍 Sent to server: ${lat}, ${lng}`);
            });
          },
          (error) => {
            status.textContent = "❌ Error: " + error.message;
          },
          {
            enableHighAccuracy: true,
            maximumAge: 10000,
            timeout: 5000,
          }
        );
      }
    </script>

    <!-- ✅ เปลี่ยน YOUR_API_KEY เป็น API Key ของ Google Maps -->
    <script async defer
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBw5pZ4H0EdM_Ru4ffFvdukIurUMtdS2nc&callback=initMap">
    </script>
  </body>
</html>
