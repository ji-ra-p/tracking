<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <title>Vehicle Tracker</title>
  </head>
  <body>
    <script>
      const vehicleID = 'car123'; // เปลี่ยนเป็นชื่อรถเฉพาะแต่ละคันได้

      function sendLocation(position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const url = `https://script.google.com/macros/s/AKfycbyA79qRoYTLZi_2BmpgEf0oaHPssh9xvmoZLXk6tObRf-iCdE_9a1HWpsPtQXw104ZA/exec?vehicle=${vehicleID}&lat=${lat}&lng=${lng}`;
        fetch(url).then(r => console.log("📍 Location sent:", lat, lng));
      }

      function handleError(error) {
        console.error("❌ Location error:", error);
      }

      // ตรวจจับพิกัดอัตโนมัติ
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(sendLocation, handleError, {
          enableHighAccuracy: true,
          maximumAge: 10000,
          timeout: 5000
        });
      } else {
        console.error("Geolocation not supported");
      }
    </script>
  </body>
</html>
