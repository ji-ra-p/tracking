<!DOCTYPE html>
<html>
  <head>
    <title>Vehicle Tracker with Route</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 20px;
      }
      #map {
        height: 500px;
        width: 100%;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h2>🚗 Vehicle Tracker</h2>
    <label for="vehicleID">Vehicle ID:</label>
    <input type="text" id="vehicleID" placeholder="e.g. car123" />
    <button onclick="startTracking()">Start Tracking</button>
    <p id="status"></p>
    <div id="map"></div>

    <script>
      let map, marker, watchId;
      let routePath; // เส้นทาง
      let routeCoords = []; // Array สำหรับเก็บพิกัด

      function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 13.736717, lng: 100.523186 },
          zoom: 15,
        });

        // สร้างเส้นทางเริ่มต้น
        routePath = new google.maps.Polyline({
          path: routeCoords,
          geodesic: true,
          strokeColor: "#2196F3", // สีฟ้า
          strokeOpacity: 1.0,
          strokeWeight: 4,
        });

        routePath.setMap(map);
      }

      function startTracking() {
        const vehicleID = document.getElementById("vehicleID").value.trim();
        const status = document.getElementById("status");

        if (!vehicleID) {
          status.textContent = "❗ กรุณากรอก Vehicle ID ก่อนเริ่มใช้งาน";
          return;
        }

        if (!navigator.geolocation) {
          status.textContent = "❌ เบราว์เซอร์นี้ไม่รองรับ Geolocation";
          return;
        }

        status.textContent = `📡 เริ่มติดตาม "${vehicleID}" แล้ว...`;

        // โหลดตำแหน่งเริ่มต้นของวัน
        fetch(`https://script.google.com/macros/s/AKfycbyA79qRoYTLZi_2BmpgEf0oaHPssh9xvmoZLXk6tObRf-iCdE_9a1HWpsPtQXw104ZA/exec?vehicle=${vehicleID}&first=1`)
          .then((res) => res.json())
          .then((data) => {
            if (data && data.lat && data.lng) {
              const startPos = { lat: parseFloat(data.lat), lng: parseFloat(data.lng) };
              new google.maps.Marker({
                position: startPos,
                map: map,
                label: "Start",
              });
              map.setCenter(startPos);
              routeCoords.push(startPos);
              routePath.setPath(routeCoords);
            }
          });

        // เริ่มติดตามแบบ Real-time
        watchId = navigator.geolocation.watchPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const pos = { lat, lng };

            if (!marker) {
              marker = new google.maps.Marker({
                position: pos,
                map: map,
                title: "Current Position",
              });
            } else {
              marker.setPosition(pos);
            }

            // เพิ่มพิกัดในเส้นทาง
            routeCoords.push(pos);
            routePath.setPath(routeCoords);
            map.setCenter(pos);

            // ส่งข้อมูลไปยัง Apps Script
            const url = `https://script.google.com/macros/s/AKfycbyA79qRoYTLZi_2BmpgEf0oaHPssh9xvmoZLXk6tObRf-iCdE_9a1HWpsPtQXw104ZA/exec?vehicle=${vehicleID}&lat=${lat}&lng=${lng}`;
            fetch(url).then(() => {
              console.log(`📍 ส่งตำแหน่ง: ${lat}, ${lng}`);
            });
          },
          (error) => {
            status.textContent = "❌ เกิดข้อผิดพลาด: " + error.message;
          },
          {
            enableHighAccuracy: true,
            maximumAge: 10000,
            timeout: 5000,
          }
        );
      }
    </script>

    <!-- 🔑 ใช้ API Key จริงของคุณที่เปิด Maps JavaScript API -->
    <script async defer
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBw5pZ4H0EdM_Ru4ffFvdukIurUMtdS2nc&callback=initMap">
    </script>
  </body>
</html>
