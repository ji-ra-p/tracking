<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <title>Vehicle Tracker</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      input, button {
        padding: 10px;
        font-size: 1rem;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h2>🚗 Vehicle Tracker</h2>
    <label for="vehicleID">Enter Vehicle ID:</label><br>
    <input type="text" id="vehicleID" placeholder="e.g. car123"><br>
    <button onclick="startTracking()">Start Tracking</button>

    <p id="status"></p>

    <script>
      let watchId = null;

      function startTracking() {
        const vehicleID = document.getElementById("vehicleID").value.trim();
        const status = document.getElementById("status");

        if (!vehicleID) {
          status.textContent = "❗ Please enter a vehicle ID.";
          return;
        }

        if (!navigator.geolocation) {
          status.textContent = "❌ Geolocation is not supported by this browser.";
          return;
        }

        status.textContent = "📡 Tracking started for vehicle: " + vehicleID;

        watchId = navigator.geolocation.watchPosition(
          position => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            const url = `https://script.google.com/macros/s/AKfycbyA79qRoYTLZi_2BmpgEf0oaHPssh9xvmoZLXk6tObRf-iCdE_9a1HWpsPtQXw104ZA/exec?vehicle=${vehicleID}&lat=${lat}&lng=${lng}`;
            fetch(url).then(() => {
              console.log(`✅ Sent location for ${vehicleID}: ${lat}, ${lng}`);
            });
          },
          error => {
            status.textContent = "❌ Error getting location: " + error.message;
          },
          {
            enableHighAccuracy: true,
            maximumAge: 10000,
            timeout: 5000
          }
        );
      }
    </script>
  </body>
</html>
